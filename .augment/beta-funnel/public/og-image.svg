  <text x="96" y="380" fill="#F4EFE6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="600" letter-spacing="-0.8">Plan the night. Send one link. Everyone's in.</text>
