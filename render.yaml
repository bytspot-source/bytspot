services:

  # ─── Beta Funnel: Marketing / Signup / /welcome ───────────────────────────
  - type: static
    name: bytspot-beta
    branch: beta-funnel/deploy
    rootDir: .augment/beta-funnel
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - "**"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  # ─── Flyers: Standalone static flyer pages ────────────────────────────────
  - type: static
    name: bytspot-flyers
    branch: main
    rootDir: .augment/flyers
    buildCommand: echo "static"
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - "**"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  # ─── API: Express / Prisma / Resend ───────────────────────────────────────
  # SECURITY DEPLOYMENT REQUIREMENT: Route public API traffic through Cloudflare
  # only; block direct Render-origin access. Cloudflare must overwrite incoming
  # X-Forwarded-For before forwarding, because Express trusts the Cloudflare →
  # Render proxy chain for per-client rate limiting.
  - type: web
    name: bytspot-api
    runtime: node
    branch: main
    rootDir: .augment/bytspot-api
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/index.js
    # /health verifies Postgres and Redis, so a wedged process stops taking
    # traffic instead of serving errors until someone notices.
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - "**"
    envVars:
      - key: NODE_ENV
        value: production
      # Starting rate until an admin appends a PlatformFeeSetting row. 150 bps
      # = 1.5% of the gross ticket price, frozen onto each party at publish.
      - key: DEFAULT_PLATFORM_FEE_BPS
        value: 150
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # APNs signing key: upload the .p8 as a Render Secret File (Dashboard →
      # Environment → Secret Files), then point APNS_KEY_PATH at its mount,
      # /etc/secrets/<filename>. Blueprints cannot declare secret files, so
      # this comment is the only place that contract is recorded. Without the
      # mount the credentials still read as configured and sign nothing;
      # /health reports checks.push=key-unreadable when that happens.
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_PATH
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_ENVIRONMENT
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SERVER_CLIENT_ID
        sync: false
      - key: CONTACT_HASH_SALT
        sync: false
      # Set in the dashboard already; declared here so the runtime contract is
      # readable from the repo rather than only from Render.
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        sync: false

  # ─── Deletion purge: the half of "delete my account" that actually deletes ─
  # A deletion request only sets a 30-day purge date; without this schedule
  # nothing ever acts on it. Runs against the database directly, so it needs no
  # shared secret and is not reachable from the internet.
  - type: cron
    name: bytspot-purge-accounts
    runtime: node
    branch: main
    rootDir: .augment/bytspot-api
    schedule: "17 7 * * *"
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/scripts/purgeAccounts.js
    envVars:
      - key: NODE_ENV
        value: production
      # Job mode: this process is not given the API's request-signing or
      # contact-hashing secrets. It does need Stripe: purging a host cancels
      # their parties and refunds the tickets first, and without the key every
      # refund fails and the money is held instead of returned.
      - key: BYTSPOT_RUNTIME
        value: job
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

