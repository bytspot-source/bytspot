services:

  # ─── Beta Funnel: Marketing / Signup / /welcome ───────────────────────────
  - type: static
    name: bytspot-beta
    branch: beta-funnel/deploy
    rootDir: .augment/beta-funnel
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - "**"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  # ─── Flyers: Standalone static flyer pages ────────────────────────────────
  - type: static
    name: bytspot-flyers
    branch: main
    rootDir: .augment/flyers
    buildCommand: echo "static"
    staticPublishPath: ./
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - "**"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  # ─── API: Express / Prisma / Resend ───────────────────────────────────────
  # SECURITY DEPLOYMENT REQUIREMENT: Route public API traffic through Cloudflare
  # only; block direct Render-origin access. Cloudflare must overwrite incoming
  # X-Forwarded-For before forwarding, because Express trusts the Cloudflare →
  # Render proxy chain for per-client rate limiting.
  - type: web
    name: bytspot-api
    runtime: node
    branch: main
    rootDir: .augment/bytspot-api
    buildCommand: npm ci && npx prisma generate && npm run build
    # ONE-SHOT (revert immediately after the next successful deploy):
    # 20260821_add_user_soft_delete failed part-way on 2026-08-21, so every
    # deploy since has been refused with P3009 and production is pinned to
    # 8542954. Clearing that one failed row lets the now-replayable migration
    # re-run. Scoped to this single migration by name and tolerant of it
    # already being cleared; it must not stay in place, or a future failed
    # migration would be swept away silently instead of stopping the deploy.
    preDeployCommand: (npx prisma migrate resolve --rolled-back 20260821_add_user_soft_delete || true) && npx prisma migrate deploy
    startCommand: node dist/index.js
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - "**"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_PATH
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_ENVIRONMENT
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SERVER_CLIENT_ID
        sync: false
      - key: CONTACT_HASH_SALT
        sync: false

