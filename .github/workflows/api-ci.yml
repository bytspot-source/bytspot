name: API CI

on:
  push:
    branches: [main]
    paths: ['.augment/bytspot-api/**', '.github/workflows/api-ci.yml', 'render.yaml']
  pull_request:
    paths: ['.augment/bytspot-api/**', '.github/workflows/api-ci.yml', 'render.yaml']

# render.yaml names the preDeployCommand that runs the migrations, so a change
# to how production deploys is a change this workflow should see. It was edited
# once already without CI running.

# main autodeploys, so two pushes in quick succession race and the older run can
# report last, greening a commit the newer one failed.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .augment/bytspot-api

jobs:
  # The migrations are the gate this repo was missing. 20260821_add_user_soft_delete
  # named a table that does not exist, passed every unit test, and then blocked
  # production deploys for a week: unit tests never touch a real database, so
  # nothing executed the SQL until Render did. This job executes it.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bytspot_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytspot_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .augment/bytspot-api/package-lock.json
      - run: npm ci

      # Applies every migration in order against an empty database, exactly as
      # Render does. A migration referencing a missing table fails here.
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      # Applying cleanly is not enough: the result has to be the schema the
      # client is generated from. This caught user_preferences, a table that
      # only ever existed because `prisma db push` created it in production.
      #
      # postgis and vector are excluded because this Postgres cannot host them;
      # 20260226 already enables them defensively for the same reason. Any other
      # difference fails the job.
      - name: Migrations must produce the schema the code expects
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma > drift.txt 2>/dev/null
          remaining=$(grep -vE '^[[:space:]]*$|\[\+\] Added extensions|^[[:space:]]*- (postgis|vector)$|No difference detected' drift.txt || true)
          if [ -n "$remaining" ]; then
            echo "Migrations do not produce schema.prisma:"; echo "$remaining"; exit 1
          fi
          echo "database matches schema.prisma (postgis/vector excluded)"

      # Re-running must be a no-op. A deploy that retries after a partial
      # failure replays the pending migration, which is how the last incident
      # was recovered.
      - name: Re-applying is a no-op
        run: npx prisma migrate deploy | tee /tmp/replay.log && grep -q "No pending migrations to apply" /tmp/replay.log

  # The job above applies to an empty database, so a backfill there reads zero
  # rows and passes. 20260824_add_vehicle_table was green on it and then aborted
  # Render's preDeployCommand on the first real row, leaving production serving
  # the previous build for an hour.
  #
  # This job puts rows in front of the change: prior migrations, then hostile
  # shapes, then the migrations this branch adds. It asserts on the resulting
  # rows rather than the exit code, because the worse defect of that pair —
  # inventing a vehicle out of a JSON string — exited 0.
  backfill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bytspot_backfill
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytspot_backfill?schema=public
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .augment/bytspot-api/package-lock.json
      - run: npm ci

      # A change that adds no migrations has nothing to execute here. Skipping
      # is the correct outcome and has to be quiet: a gate that fails on the
      # common case is a gate someone removes.
      - name: Migrations added by this change
        id: added
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch -q origin "${{ github.base_ref || 'main' }}"
          dirs=$(git diff --name-only "$base...HEAD" -- prisma/migrations \
            | sed -n 's#.*prisma/migrations/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          if [ -z "$dirs" ]; then echo "no migrations added; nothing to execute"; fi

      - name: Seed hostile shapes, then apply the new migrations to them
        if: steps.added.outputs.dirs != ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/held
          for d in ${{ steps.added.outputs.dirs }}; do mv "prisma/migrations/$d" /tmp/held/; done
          npx prisma migrate deploy
          for d in ${{ steps.added.outputs.dirs }}; do mv "/tmp/held/$d" prisma/migrations/; done

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f prisma/fixtures/hostile-shapes.sql
          npx prisma migrate deploy

      # Exit code is not the assertion. The rows are.
      - name: The backfill did not drop or invent anything
        if: steps.added.outputs.dirs != ''
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f prisma/fixtures/hostile-shapes.assert.sql

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .augment/bytspot-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Tests are typechecked too: the exclude that skipped them was written
      # when they lived outside src, and it silently hid eleven type errors.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # The web repo has gated on this for months; the API shipped a known
      # ReDoS in its request path because nothing checked here. Accepted
      # exceptions are dated in scripts/audit-gate.mjs and expire on their own.
      - name: Security audit (runtime dependencies)
        run: node scripts/audit-gate.mjs
      - name: Full dependency audit advisory
        continue-on-error: true
        run: npm audit --audit-level=high
